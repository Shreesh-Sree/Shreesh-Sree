<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380">
  <defs>
    <style>
      @keyframes itemReveal {
        from { opacity: 0; transform: translateX(-8px); }
        to { opacity: 1; transform: translateX(0); }
      }
      @keyframes barFill {
        from { width: 0; }
        to { width: 100%; }
      }
      @keyframes orbFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
      .item { animation: itemReveal 0.5s ease-out forwards; opacity: 0; }
      .orb { animation: orbFloat 3s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="900" height="380" fill="#0a0a0f"/>

  <!-- Section header -->
  <text x="40" y="35" font-family="'Courier New', monospace" font-size="11" fill="#00ff9f" opacity="0.5">$ cat /proc/mind/inventory</text>

  <!-- LANGUAGES Column -->
  <g transform="translate(40, 60)">
    <text x="0" y="15" font-family="'Courier New', monospace" font-size="12" fill="#ff006e" font-weight="bold">LANGUAGES</text>
    <line x1="0" y1="22" x2="160" y2="22" stroke="#ff006e" stroke-width="1" opacity="0.3"/>

    <g class="item" style="animation-delay: 0.1s;" transform="translate(0, 40)">
      <rect x="0" y="0" width="4" height="4" fill="#00ff9f" class="orb"/>
      <text x="12" y="5" font-family="'Courier New', monospace" font-size="11" fill="#e0e0e0">Python</text>
      <rect x="80" y="0" width="80" height="4" fill="#1a1a2e"/>
      <rect x="80" y="0" width="72" height="4" fill="#00ff9f" opacity="0.7"/>
    </g>
    <g class="item" style="animation-delay: 0.2s;" transform="translate(0, 62)">
      <rect x="0" y="0" width="4" height="4" fill="#00ff9f" class="orb" style="animation-delay: 0.5s;"/>
      <text x="12" y="5" font-family="'Courier New', monospace" font-size="11" fill="#e0e0e0">TypeScript</text>
      <rect x="80" y="0" width="80" height="4" fill="#1a1a2e"/>
      <rect x="80" y="0" width="64" height="4" fill="#00ff9f" opacity="0.6"/>
    </g>
    <g class="item" style="animation-delay: 0.3s;" transform="translate(0, 84)">
      <rect x="0" y="0" width="4" height="4" fill="#00ff9f" class="orb" style="animation-delay: 1s;"/>
      <text x="12" y="5" font-family="'Courier New', monospace" font-size="11" fill="#e0e0e0">Go</text>
      <rect x="80" y="0" width="80" height="4" fill="#1a1a2e"/>
      <rect x="80" y="0" width="48" height="4" fill="#00ff9f" opacity="0.5"/>
    </g>
    <g class="item" style="animation-delay: 0.4s;" transform="translate(0, 106)">
      <rect x="0" y="0" width="4" height="4" fill="#00ff9f" class="orb" style="animation-delay: 1.5s;"/>
      <text x="12" y="5" font-family="'Courier New', monospace" font-size="11" fill="#e0e0e0">JavaScript</text>
      <rect x="80" y="0" width="80" height="4" fill="#1a1a2e"/>
      <rect x="80" y="0" width="56" height="4" fill="#00ff9f" opacity="0.5"/>
    </g>
  </g>

  <!-- FRAMEWORKS Column -->
  <g transform="translate(250, 60)">
    <text x="0" y="15" font-family="'Courier New', monospace" font-size="12" fill="#7b2ff7" font-weight="bold">FRAMEWORKS</text>
    <line x1="0" y1="22" x2="160" y2="22" stroke="#7b2ff7" stroke-width="1" opacity="0.3"/>

    <g class="item" style="animation-delay: 0.5s;" transform="translate(0, 40)">
      <rect x="0" y="0" width="4" height="4" fill="#7b2ff7" class="orb"/>
      <text x="12" y="5" font-family="'Courier New', monospace" font-size="11" fill="#e0e0e0">FastAPI</text>
    </g>
    <g class="item" style="animation-delay: 0.6s;" transform="translate(0, 62)">
      <rect x="0" y="0" width="4" height="4" fill="#7b2ff7" class="orb" style="animation-delay: 0.5s;"/>
      <text x="12" y="5" font-family="'Courier New', monospace" font-size="11" fill="#e0e0e0">React / Next.js</text>
    </g>
    <g class="item" style="animation-delay: 0.7s;" transform="translate(0, 84)">
      <rect x="0" y="0" width="4" height="4" fill="#7b2ff7" class="orb" style="animation-delay: 1s;"/>
      <text x="12" y="5" font-family="'Courier New', monospace" font-size="11" fill="#e0e0e0">LangGraph</text>
    </g>
    <g class="item" style="animation-delay: 0.8s;" transform="translate(0, 106)">
      <rect x="0" y="0" width="4" height="4" fill="#7b2ff7" class="orb" style="animation-delay: 1.5s;"/>
      <text x="12" y="5" font-family="'Courier New', monospace" font-size="11" fill="#e0e0e0">PyTorch</text>
    </g>
  </g>

  <!-- CLOUD Column -->
  <g transform="translate(480, 60)">
    <text x="0" y="15" font-family="'Courier New', monospace" font-size="12" fill="#ffbe0b" font-weight="bold">CLOUD</text>
    <line x1="0" y1="22" x2="160" y2="22" stroke="#ffbe0b" stroke-width="1" opacity="0.3"/>

    <g class="item" style="animation-delay: 0.9s;" transform="translate(0, 40)">
      <rect x="0" y="0" width="4" height="4" fill="#ffbe0b" class="orb"/>
      <text x="12" y="5" font-family="'Courier New', monospace" font-size="11" fill="#e0e0e0">AWS Lambda</text>
    </g>
    <g class="item" style="animation-delay: 1.0s;" transform="translate(0, 62)">
      <rect x="0" y="0" width="4" height="4" fill="#ffbe0b" class="orb" style="animation-delay: 0.5s;"/>
      <text x="12" y="5" font-family="'Courier New', monospace" font-size="11" fill="#e0e0e0">SQS / DynamoDB</text>
    </g>
    <g class="item" style="animation-delay: 1.1s;" transform="translate(0, 84)">
      <rect x="0" y="0" width="4" height="4" fill="#ffbe0b" class="orb" style="animation-delay: 1s;"/>
      <text x="12" y="5" font-family="'Courier New', monospace" font-size="11" fill="#e0e0e0">API Gateway</text>
    </g>
    <g class="item" style="animation-delay: 1.2s;" transform="translate(0, 106)">
      <rect x="0" y="0" width="4" height="4" fill="#ffbe0b" class="orb" style="animation-delay: 1.5s;"/>
      <text x="12" y="5" font-family="'Courier New', monospace" font-size="11" fill="#e0e0e0">Bedrock</text>
    </g>
  </g>

  <!-- INFRA Column -->
  <g transform="translate(700, 60)">
    <text x="0" y="15" font-family="'Courier New', monospace" font-size="12" fill="#00ff9f" font-weight="bold">INFRA</text>
    <line x1="0" y1="22" x2="160" y2="22" stroke="#00ff9f" stroke-width="1" opacity="0.3"/>

    <g class="item" style="animation-delay: 1.3s;" transform="translate(0, 40)">
      <rect x="0" y="0" width="4" height="4" fill="#00ff9f" class="orb"/>
      <text x="12" y="5" font-family="'Courier New', monospace" font-size="11" fill="#e0e0e0">Terraform</text>
    </g>
    <g class="item" style="animation-delay: 1.4s;" transform="translate(0, 62)">
      <rect x="0" y="0" width="4" height="4" fill="#00ff9f" class="orb" style="animation-delay: 0.5s;"/>
      <text x="12" y="5" font-family="'Courier New', monospace" font-size="11" fill="#e0e0e0">Docker</text>
    </g>
    <g class="item" style="animation-delay: 1.5s;" transform="translate(0, 84)">
      <rect x="0" y="0" width="4" height="4" fill="#00ff9f" class="orb" style="animation-delay: 1s;"/>
      <text x="12" y="5" font-family="'Courier New', monospace" font-size="11" fill="#e0e0e0">PostgreSQL</text>
    </g>
    <g class="item" style="animation-delay: 1.6s;" transform="translate(0, 106)">
      <rect x="0" y="0" width="4" height="4" fill="#00ff9f" class="orb" style="animation-delay: 1.5s;"/>
      <text x="12" y="5" font-family="'Courier New', monospace" font-size="11" fill="#e0e0e0">Redis / FAISS</text>
    </g>
  </g>

  <!-- AI/ML Section below -->
  <g transform="translate(40, 220)">
    <text x="0" y="15" font-family="'Courier New', monospace" font-size="12" fill="#ff006e" font-weight="bold">AI / ML LAYER</text>
    <line x1="0" y1="22" x2="820" y2="22" stroke="#ff006e" stroke-width="1" opacity="0.15"/>

    <g class="item" style="animation-delay: 1.7s;" transform="translate(0, 40)">
      <text x="0" y="5" font-family="'Courier New', monospace" font-size="11" fill="#e0e0e0" opacity="0.8">Ollama</text>
      <text x="70" y="5" font-family="'Courier New', monospace" font-size="11" fill="#555">|</text>
      <text x="85" y="5" font-family="'Courier New', monospace" font-size="11" fill="#e0e0e0" opacity="0.8">Groq</text>
      <text x="130" y="5" font-family="'Courier New', monospace" font-size="11" fill="#555">|</text>
      <text x="145" y="5" font-family="'Courier New', monospace" font-size="11" fill="#e0e0e0" opacity="0.8">LangGraph</text>
      <text x="235" y="5" font-family="'Courier New', monospace" font-size="11" fill="#555">|</text>
      <text x="250" y="5" font-family="'Courier New', monospace" font-size="11" fill="#e0e0e0" opacity="0.8">pgvector</text>
      <text x="330" y="5" font-family="'Courier New', monospace" font-size="11" fill="#555">|</text>
      <text x="345" y="5" font-family="'Courier New', monospace" font-size="11" fill="#e0e0e0" opacity="0.8">FAISS</text>
      <text x="400" y="5" font-family="'Courier New', monospace" font-size="11" fill="#555">|</text>
      <text x="415" y="5" font-family="'Courier New', monospace" font-size="11" fill="#e0e0e0" opacity="0.8">PyTorch</text>
      <text x="490" y="5" font-family="'Courier New', monospace" font-size="11" fill="#555">|</text>
      <text x="505" y="5" font-family="'Courier New', monospace" font-size="11" fill="#e0e0e0" opacity="0.8">RAG Pipelines</text>
    </g>
  </g>

  <!-- Decorative pixel cluster bottom-right -->
  <g transform="translate(820, 320)" opacity="0.3">
    <rect x="0" y="0" width="4" height="4" fill="#7b2ff7"/>
    <rect x="6" y="6" width="4" height="4" fill="#ff006e"/>
    <rect x="12" y="2" width="3" height="3" fill="#00ff9f"/>
    <rect x="4" y="14" width="3" height="3" fill="#ffbe0b"/>
    <rect x="18" y="10" width="4" height="4" fill="#7b2ff7"/>
  </g>
</svg>
