<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320">
  <defs>
    <style>
      @keyframes glitch1 {
        0%, 100% { transform: translate(0, 0); opacity: 1; }
        20% { transform: translate(-2px, 1px); opacity: 0.8; }
        40% { transform: translate(2px, -1px); opacity: 0.9; }
        60% { transform: translate(-1px, 2px); opacity: 0.7; }
        80% { transform: translate(1px, -2px); opacity: 1; }
      }
      @keyframes glitch2 {
        0%, 100% { transform: translate(0, 0); }
        25% { transform: translate(3px, 0); }
        50% { transform: translate(-3px, 0); }
        75% { transform: translate(1px, 0); }
      }
      @keyframes scanline {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(400%); }
      }
      @keyframes flicker {
        0%, 95%, 100% { opacity: 1; }
        96% { opacity: 0.4; }
        97% { opacity: 0.9; }
        98% { opacity: 0.3; }
      }
      @keyframes pixelDrip {
        0%, 70% { opacity: 0; transform: translateY(0); }
        80% { opacity: 1; transform: translateY(4px); }
        100% { opacity: 0; transform: translateY(16px); }
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes fadeSlide {
        0% { opacity: 0; transform: translateY(-8px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      .main-text { animation: flicker 8s infinite; }
      .glitch-r { animation: glitch1 3s infinite; fill: #ff006e; }
      .glitch-b { animation: glitch2 2.5s infinite; fill: #7b2ff7; }
      .scanline { animation: scanline 4s linear infinite; opacity: 0.03; }
      .drip { animation: pixelDrip 4s infinite; }
      .cursor { animation: blink 1s step-end infinite; }
      .subtitle { animation: fadeSlide 1.5s ease-out forwards; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="320" fill="#0a0a0f"/>

  <!-- Grid pattern -->
  <g opacity="0.04">
    <line x1="0" y1="0" x2="0" y2="320" stroke="#00ff9f" stroke-width="0.5" stroke-dasharray="2,14"/>
    <line x1="60" y1="0" x2="60" y2="320" stroke="#00ff9f" stroke-width="0.5" stroke-dasharray="2,14"/>
    <line x1="120" y1="0" x2="120" y2="320" stroke="#00ff9f" stroke-width="0.5" stroke-dasharray="2,14"/>
    <line x1="180" y1="0" x2="180" y2="320" stroke="#00ff9f" stroke-width="0.5" stroke-dasharray="2,14"/>
    <line x1="240" y1="0" x2="240" y2="320" stroke="#00ff9f" stroke-width="0.5" stroke-dasharray="2,14"/>
    <line x1="300" y1="0" x2="300" y2="320" stroke="#00ff9f" stroke-width="0.5" stroke-dasharray="2,14"/>
    <line x1="360" y1="0" x2="360" y2="320" stroke="#00ff9f" stroke-width="0.5" stroke-dasharray="2,14"/>
    <line x1="420" y1="0" x2="420" y2="320" stroke="#00ff9f" stroke-width="0.5" stroke-dasharray="2,14"/>
    <line x1="480" y1="0" x2="480" y2="320" stroke="#00ff9f" stroke-width="0.5" stroke-dasharray="2,14"/>
    <line x1="540" y1="0" x2="540" y2="320" stroke="#00ff9f" stroke-width="0.5" stroke-dasharray="2,14"/>
    <line x1="600" y1="0" x2="600" y2="320" stroke="#00ff9f" stroke-width="0.5" stroke-dasharray="2,14"/>
    <line x1="660" y1="0" x2="660" y2="320" stroke="#00ff9f" stroke-width="0.5" stroke-dasharray="2,14"/>
    <line x1="720" y1="0" x2="720" y2="320" stroke="#00ff9f" stroke-width="0.5" stroke-dasharray="2,14"/>
    <line x1="780" y1="0" x2="780" y2="320" stroke="#00ff9f" stroke-width="0.5" stroke-dasharray="2,14"/>
    <line x1="840" y1="0" x2="840" y2="320" stroke="#00ff9f" stroke-width="0.5" stroke-dasharray="2,14"/>
  </g>

  <!-- Pixel art eye - surrealist motif (top left) -->
  <g transform="translate(40, 30)" opacity="0.6">
    <rect x="12" y="0" width="4" height="4" fill="#7b2ff7"/>
    <rect x="16" y="0" width="4" height="4" fill="#7b2ff7"/>
    <rect x="20" y="0" width="4" height="4" fill="#7b2ff7"/>
    <rect x="8" y="4" width="4" height="4" fill="#7b2ff7"/>
    <rect x="24" y="4" width="4" height="4" fill="#7b2ff7"/>
    <rect x="4" y="8" width="4" height="4" fill="#7b2ff7"/>
    <rect x="12" y="8" width="4" height="4" fill="#00ff9f"/>
    <rect x="16" y="8" width="4" height="4" fill="#ffffff"/>
    <rect x="20" y="8" width="4" height="4" fill="#00ff9f"/>
    <rect x="28" y="8" width="4" height="4" fill="#7b2ff7"/>
    <rect x="4" y="12" width="4" height="4" fill="#7b2ff7"/>
    <rect x="12" y="12" width="4" height="4" fill="#00ff9f"/>
    <rect x="16" y="12" width="4" height="4" fill="#00ff9f"/>
    <rect x="20" y="12" width="4" height="4" fill="#00ff9f"/>
    <rect x="28" y="12" width="4" height="4" fill="#7b2ff7"/>
    <rect x="8" y="16" width="4" height="4" fill="#7b2ff7"/>
    <rect x="24" y="16" width="4" height="4" fill="#7b2ff7"/>
    <rect x="12" y="20" width="4" height="4" fill="#7b2ff7"/>
    <rect x="16" y="20" width="4" height="4" fill="#7b2ff7"/>
    <rect x="20" y="20" width="4" height="4" fill="#7b2ff7"/>
  </g>

  <!-- Dripping pixels from eye -->
  <g transform="translate(56, 58)">
    <rect x="0" y="0" width="4" height="4" fill="#7b2ff7" class="drip" style="animation-delay: 0s;"/>
    <rect x="0" y="10" width="4" height="4" fill="#7b2ff7" class="drip" style="animation-delay: 0.5s;"/>
    <rect x="0" y="20" width="4" height="4" fill="#7b2ff7" class="drip" style="animation-delay: 1s;"/>
  </g>

  <!-- Main name - pixel font style -->
  <g class="main-text">
    <text x="450" y="130" font-family="'Courier New', monospace" font-size="58" font-weight="bold" fill="#00ff9f" text-anchor="middle" letter-spacing="4">SREESANTH R</text>
  </g>

  <!-- Glitch layers -->
  <g class="glitch-r" opacity="0.4">
    <text x="452" y="131" font-family="'Courier New', monospace" font-size="58" font-weight="bold" text-anchor="middle" letter-spacing="4">SREESANTH R</text>
  </g>
  <g class="glitch-b" opacity="0.3">
    <text x="448" y="129" font-family="'Courier New', monospace" font-size="58" font-weight="bold" text-anchor="middle" letter-spacing="4">SREESANTH R</text>
  </g>

  <!-- Subtitle -->
  <g class="subtitle">
    <text x="450" y="170" font-family="'Courier New', monospace" font-size="14" fill="#e0e0e0" text-anchor="middle" opacity="0.7" letter-spacing="6">BACKEND &amp; AI ENGINEER</text>
  </g>

  <!-- Terminal prompt -->
  <text x="450" y="220" font-family="'Courier New', monospace" font-size="13" fill="#00ff9f" text-anchor="middle" opacity="0.5">
    <tspan>$ the machine dreams in vector spaces</tspan>
  </text>

  <!-- Blinking cursor -->
  <rect x="658" y="209" width="8" height="14" fill="#00ff9f" class="cursor" opacity="0.5"/>

  <!-- Bottom pixel border -->
  <g transform="translate(0, 280)">
    <rect x="100" y="0" width="4" height="4" fill="#ff006e" opacity="0.6"/>
    <rect x="108" y="0" width="4" height="4" fill="#00ff9f" opacity="0.4"/>
    <rect x="200" y="0" width="4" height="4" fill="#7b2ff7" opacity="0.5"/>
    <rect x="204" y="0" width="4" height="4" fill="#7b2ff7" opacity="0.3"/>
    <rect x="350" y="0" width="4" height="4" fill="#ff006e" opacity="0.4"/>
    <rect x="500" y="0" width="4" height="4" fill="#00ff9f" opacity="0.6"/>
    <rect x="504" y="0" width="4" height="4" fill="#00ff9f" opacity="0.3"/>
    <rect x="650" y="0" width="4" height="4" fill="#7b2ff7" opacity="0.5"/>
    <rect x="700" y="0" width="4" height="4" fill="#ff006e" opacity="0.4"/>
    <rect x="800" y="0" width="4" height="4" fill="#00ff9f" opacity="0.5"/>
  </g>

  <!-- Floating pixel fragments (surreal) -->
  <g opacity="0.3">
    <rect x="820" y="50" width="6" height="6" fill="#ff006e" class="drip" style="animation-delay: 0.2s;"/>
    <rect x="835" y="65" width="4" height="4" fill="#ffbe0b" class="drip" style="animation-delay: 0.8s;"/>
    <rect x="810" y="80" width="5" height="5" fill="#00ff9f" class="drip" style="animation-delay: 1.4s;"/>
    <rect x="60" y="250" width="4" height="4" fill="#ff006e" class="drip" style="animation-delay: 0.6s;"/>
    <rect x="75" y="240" width="3" height="3" fill="#00ff9f" class="drip" style="animation-delay: 1.2s;"/>
  </g>

  <!-- Scanline overlay -->
  <rect x="0" y="0" width="900" height="4" fill="#ffffff" class="scanline"/>

  <!-- Corner coordinates (surreal detail) -->
  <text x="20" y="310" font-family="'Courier New', monospace" font-size="9" fill="#00ff9f" opacity="0.3">13.0827°N 80.2707°E</text>
  <text x="780" y="310" font-family="'Courier New', monospace" font-size="9" fill="#00ff9f" opacity="0.3">PID: ∞</text>
  <text x="780" y="15" font-family="'Courier New', monospace" font-size="9" fill="#ff006e" opacity="0.3">SIGNAL::FOUND</text>
</svg>
