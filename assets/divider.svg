<svg xmlns="http://www.w3.org/2000/svg" width="900" height="40" viewBox="0 0 900 40">
  <defs>
    <style>
      @keyframes wave {
        0% { transform: translateX(0); }
        100% { transform: translateX(-60px); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.8; }
      }
      .wave-group { animation: wave 3s linear infinite; }
      .pulse-dot { animation: pulse 2s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="900" height="40" fill="transparent"/>

  <!-- Center line -->
  <line x1="100" y1="20" x2="800" y2="20" stroke="#1a1a2e" stroke-width="1"/>

  <!-- Pixel wave pattern -->
  <g class="wave-group">
    <g>
      <rect x="100" y="18" width="3" height="3" fill="#00ff9f" opacity="0.4"/>
      <rect x="160" y="16" width="3" height="3" fill="#00ff9f" opacity="0.6"/>
      <rect x="220" y="19" width="3" height="3" fill="#7b2ff7" opacity="0.5"/>
      <rect x="280" y="15" width="3" height="3" fill="#ff006e" opacity="0.4"/>
      <rect x="340" y="18" width="3" height="3" fill="#00ff9f" opacity="0.7"/>
      <rect x="400" y="20" width="3" height="3" fill="#00ff9f" opacity="0.5"/>
      <rect x="460" y="17" width="3" height="3" fill="#7b2ff7" opacity="0.6"/>
      <rect x="520" y="19" width="3" height="3" fill="#ff006e" opacity="0.4"/>
      <rect x="580" y="16" width="3" height="3" fill="#00ff9f" opacity="0.5"/>
      <rect x="640" y="20" width="3" height="3" fill="#00ff9f" opacity="0.6"/>
      <rect x="700" y="18" width="3" height="3" fill="#7b2ff7" opacity="0.4"/>
      <rect x="760" y="17" width="3" height="3" fill="#ff006e" opacity="0.5"/>
      <rect x="820" y="19" width="3" height="3" fill="#00ff9f" opacity="0.4"/>
      <rect x="880" y="16" width="3" height="3" fill="#00ff9f" opacity="0.6"/>
      <rect x="940" y="18" width="3" height="3" fill="#7b2ff7" opacity="0.5"/>
    </g>
  </g>

  <!-- Center diamond -->
  <g transform="translate(447, 17)" class="pulse-dot">
    <rect x="3" y="0" width="3" height="3" fill="#00ff9f"/>
    <rect x="0" y="3" width="3" height="3" fill="#00ff9f"/>
    <rect x="6" y="3" width="3" height="3" fill="#00ff9f"/>
    <rect x="3" y="6" width="3" height="3" fill="#00ff9f"/>
  </g>
</svg>
