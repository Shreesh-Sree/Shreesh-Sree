name: readme

on:
  schedule:
    - cron: "17 */6 * * *"     # every 6 hours, off the hour to dodge the :00 rush
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/profile.json"
      - "scripts/**"
      - ".github/workflows/readme.yml"

permissions:
  contents: write

concurrency:
  group: readme
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build SVGs from live GitHub data
        env:
          # Optional: add a fine-grained PAT as PROFILE_TOKEN to count private contributions.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/build.py

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data/cache.json README.md
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "chore(readme): sync live stats [skip ci]"
          git push
